<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Evento - Eventify</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen">

<div class="max-w-3xl mx-auto px-4 py-8">

    <!-- Encabezado del Panel -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between border-b border-gray-200 pb-6 mb-8">
        <div>
            <h1 class="text-3xl font-extrabold tracking-tight text-gray-900">Registrar nuevo evento</h1>
            <p class="mt-2 text-sm text-gray-600">Completa el formulario para añadir un nuevo evento programado en
                Eventify.</p>
        </div>
        <div class="mt-4 sm:mt-0">
            <!-- Botón Volver con el estilo secundario del sistema de diseño -->
            <a th:href="@{/admin/events}" class="inline-flex items-center justify-center px-4 py-2 border border-gray-300 text-sm
            font-medium rounded-md shadow-sm text-gray-700 bg-white hover:bg-gray-50
            focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors cursor-pointer">
                Volver al Panel
            </a>
        </div>
    </div>

    <!-- Contenedor del Formulario con Sombra y Bordes Redondeados -->
    <div class="bg-white shadow-sm border border-gray-200 rounded-xl overflow-hidden p-6 sm:p-8">

        <!-- th:action -> Indica a qué URL se enviará el formulario -->
        <!-- th:object -> Indica que este formulario está vinculado al objeto event que enviamos desde el Controller -->
        <!-- th:field -> Significa que este input está vinculado al atributo: -->
        <form th:action="@{/admin/events}" th:object="${event}" method="post" class="space-y-6">

            <!-- Campo: Nombre -->
            <div>
                <label for="nombre" class="block text-sm font-semibold text-gray-700 mb-2">Nombre del Evento</label>
                <input
                        type="text"
                        id="nombre"
                        th:field="*{nombre}"
                        placeholder="Ej. Concierto de Rock Nacional"
                        class="block w-full rounded-md border border-gray-300 px-4 py-2.5 text-gray-900 placeholder-gray-400
                        shadow-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 focus:outline-none text-sm transition-colors"
                        required
                >
            </div>

            <!-- Campo: Descripción -->
            <div>
                <label for="descripcion" class="block text-sm font-semibold text-gray-700 mb-2">Descripción</label>
                <textarea
                        id="descripcion"
                        th:field="*{descripcion}"
                        rows="4"
                        placeholder="Escribe los detalles relevantes del evento..."
                        class="block w-full rounded-md border border-gray-300 px-4 py-2.5 text-gray-900 placeholder-gray-400
                        shadow-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 focus:outline-none text-sm transition-colors resize-none"
                        required
                ></textarea>
            </div>

            <!-- Campo: Fecha -->
            <div>
                <label for="fecha" class="block text-sm font-semibold text-gray-700 mb-2">Fecha y Hora</label>
                <input
                        type="datetime-local"
                        id="fecha"
                        th:field="*{fecha}"
                        class="block w-full sm:w-64 rounded-md border border-gray-300 px-4 py-2.5 text-gray-900
                        shadow-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 focus:outline-none text-sm transition-colors"
                        required
                >
            </div>

            <!-- Botón de Envío -->
            <div class="pt-4 border-t border-gray-200 flex justify-end">
                <button type="submit" class="inline-flex items-center justify-center px-5 py-2.5 border border-transparent text-sm
                font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700
                focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors cursor-pointer">
                    Guardar evento
                </button>
            </div>

        </form>
    </div>

</div>

</body>
</html>
