<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Evento - Eventify</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen">

<div class="max-w-3xl mx-auto px-4 py-8">

    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between border-b border-gray-200 pb-6 mb-8">
        <div>
            <h1 class="text-3xl font-extrabold tracking-tight text-gray-900">Registrar nuevo Evento</h1>
            <p class="mt-2 text-sm text-gray-600">Completa la información para publicar un nuevo evento.</p>
        </div>
        <div class="mt-4 sm:mt-0">
            <a th:href="@{/admin/events}" class="inline-flex items-center justify-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md shadow-sm text-gray-700 bg-white hover:bg-gray-50 transition-colors">
                Volver al Panel
            </a>
        </div>
    </div>

    <div class="bg-white shadow-sm border border-gray-200 rounded-xl overflow-hidden p-6 sm:p-8">

        <form th:action="@{/admin/events}" th:object="${event}" method="post" class="space-y-6">

            <!-- Alerta para visualizar errores de validación -->
            <div th:if="${#fields.hasErrors('*')}" class="p-4 bg-red-50 border-l-4 border-red-500 rounded-r-md mb-4">
                <h3 class="text-sm font-medium text-red-800">Por favor corrige los siguientes errores:</h3>
                <ul class="mt-2 text-sm text-red-700 list-disc list-inside">
                    <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                </ul>
            </div>

            <!-- Nombre -->
            <div>
                <label for="nombre" class="block text-sm font-semibold text-gray-700 mb-2">Nombre del Evento</label>
                <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ej. Concierto de Rock"
                       class="block w-full rounded-md border border-gray-300 px-4 py-2.5 text-gray-900 shadow-sm focus:border-indigo-500 text-sm">
            </div>

            <!-- Fecha y Hora -->
            <div>
                <label for="fecha" class="block text-sm font-semibold text-gray-700 mb-2">Fecha y Hora</label>
                <input type="datetime-local" id="fecha" th:field="*{fecha}"
                       class="block w-full sm:w-64 rounded-md border border-gray-300 px-4 py-2.5 text-gray-900 shadow-sm focus:border-indigo-500 text-sm">
            </div>

            <!-- Descripción -->
            <div>
                <label for="descripcion" class="block text-sm font-semibold text-gray-700 mb-2">Descripción</label>
                <textarea id="descripcion" th:field="*{descripcion}" rows="3" placeholder="Detalles del evento..."
                          class="block w-full rounded-md border border-gray-300 px-4 py-2.5 text-gray-900 shadow-sm focus:border-indigo-500 text-sm"></textarea>
            </div>

            <!-- Selección de Lugar (Venue) -->
            <div>
                <label for="venueId" class="block text-sm font-semibold text-gray-700 mb-2">Lugar / Sede</label>
                <select id="venueId" th:field="*{venueId}"
                        class="block w-full rounded-md border border-gray-300 px-4 py-2.5 text-gray-900 shadow-sm focus:border-indigo-500 text-sm">
                    <option value="">-- Selecciona una sede --</option>
                    <option th:each="v : ${venues}" th:value="${v.id}" th:text="${v.nombre + ' (' + v.ciudad + ')'}"></option>
                </select>
            </div>

            <!-- Categorías (Checkboxes) -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Categorías</label>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <label th:each="cat : ${categories}" class="flex items-center gap-3 p-3 border border-gray-200 rounded-md hover:bg-gray-50 cursor-pointer">
                        <input type="checkbox" th:field="*{categoryIds}" th:value="${cat.id}"
                               class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
                        <span th:text="${cat.nombre}" class="text-sm text-gray-700"></span>
                    </label>
                </div>
            </div>

            <!-- Botón Guardar -->
            <div class="pt-4 border-t border-gray-200 flex justify-end">
                <button type="submit" class="inline-flex items-center justify-center px-5 py-2.5 text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 shadow-sm">
                    Guardar Evento
                </button>
            </div>

        </form>
    </div>

</div>

</body>
</html>
